# Nome e Porta da Aplicação
spring.application.name=pathol-api
server.port=8080

# Conexão com o PostgreSQL Local
spring.datasource.url=jdbc:postgresql://localhost:5432/patholdb
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# Configurações do Hibernate / JPA para PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2 Desativado (não utilizado com PostgreSQL)
spring.h2.console.enabled=false